name: Update Anchor Games catalog

on:
  push:
    branches:
      - main
    paths:
      - "export_ankergames.py"
      - ".github/workflows/update-ankergames.yml"
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ankergames-catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare metadata cache
        run: mkdir -p .cache

      - name: Restore metadata checkpoint
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: ankergames-metadata-${{ github.run_id }}
          restore-keys: |
            ankergames-metadata-

      - name: Generate catalog
        run: >-
          python export_ankergames.py
          --output ankergames.json
          --cache .cache/ankergames-metadata.jsonl
          --workers 1
          --request-delay 0.5
          --retries 4

      - name: Save metadata checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: ankergames-metadata-${{ github.run_id }}

      - name: Validate catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("ankergames.json").read_text(encoding="utf-8"))
          downloads = catalog.get("downloads")
          required = {"title", "uris", "uploadDate", "fileSize", "descriptionHtml"}
          assert catalog.get("name") == "AnkerGames"
          assert isinstance(downloads, list) and downloads
          assert all(set(item) == required for item in downloads)
          assert all(item["descriptionHtml"].startswith("<a href=") for item in downloads)
          print(f"Validated {len(downloads)} catalog entries.")
          PY

      - name: Commit catalog when changed
        shell: bash
        run: |
          git add ankergames.json
          if git diff --cached --quiet; then
            echo "Catalog is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Anchor Games catalog"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
